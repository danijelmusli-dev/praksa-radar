[project]
name = "praksa-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"radar/agents/repair.py" = ["E501"] # dugački opisi alata i poruke
"tests/test_repair.py" = ["E501"] # YAML/HTML fixture-i u linijama
"tests/test_discovery.py" = ["E501"]
"tests/test_redteam.py" = ["E501"]
"evals/redteam/pages.py" = ["E501"]
"evals/redteam/run.py" = ["E501"]
"evals/repair_eval.py" = ["E501"]
